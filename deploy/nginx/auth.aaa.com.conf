# hex-auth 站点配置
# 放置到：/etc/nginx/conf.d/auth.aaa.com.conf
# 证书由 certbot 签发（见 DEPLOY.md），签发后 certbot --nginx 会自动补全 ssl 指令。

server {
    listen 80;
    server_name auth.aaa.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                      # nginx < 1.25.1 请改为：listen 443 ssl http2;
    server_name auth.aaa.com;

    ssl_certificate     /etc/letsencrypt/live/auth.aaa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.aaa.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 4m;

    # 管理端 API（注意：末尾不加斜杠，保留原始路径）
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 客户端授权 API（/api/v1/license/activate|heartbeat|status）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理后台前端（容器内 Nginx 托管静态产物，已做 SPA fallback 与长缓存）
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
